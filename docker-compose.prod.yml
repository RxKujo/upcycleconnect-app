version: '3.9'

services:

  db:
    image: mysql:8.0
    container_name: uc_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: upcycleconnect
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USERNAME}", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - uc_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: uc_phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      PMA_USER: ${DB_USERNAME}
      PMA_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8081:80"
    depends_on:
      - db
    networks:
      - uc_network

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: uc_api
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: upcycleconnect
      JWT_SECRET: ${JWT_SECRET}
      API_PORT: "8888"
      APP_URL: "https://${DOMAIN}"
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_PUB_MENSUEL: ${STRIPE_PRICE_PUB_MENSUEL}
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_FROM: "noreply@upcycleconnect.fr"
      # Dossier d'upload partagé avec nginx (volume uploads_data) pour que les
      # photos déposées soient servies en statique au même chemin /uploads.
      UPLOAD_DIR: /uploads/photos
    expose:
      - "8888"
    volumes:
      - uploads_data:/uploads
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - uc_network

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: php-stage
    container_name: uc_web
    restart: always
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: "https://${DOMAIN}"
      JWT_SECRET: ${JWT_SECRET}
      DB_HOST: db
      DB_PORT: "3306"
      DB_CONNECTION: mysql
      DB_DATABASE: upcycleconnect
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      API_URL: "http://api:8888"
      API_PUBLIC_URL: "https://${DOMAIN}"
      RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY}
    volumes:
      - laravel_storage:/var/www/html/storage/app
      - laravel_logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - uc_network

  nginx:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: nginx-stage
    container_name: uc_nginx
    restart: always
    expose:
      - "80"
    volumes:
      # Sert les photos uploadées (écrites par l'API dans le même volume).
      - uploads_data:/var/www/html/public/uploads:ro
    depends_on:
      - web
    networks:
      - uc_network

  # Capture des emails pour la démo (SMTP interne 1025, interface web 8025).
  # Attention : aucun email réel n'est délivré, tout est intercepté ici.
  # Attention : l'interface 8025 n'a pas d'authentification par défaut — ne pas
  #    l'exposer ouvertement sur Internet en vrai prod (tunnel SSH conseillé).
  mailpit:
    image: axllent/mailpit:latest
    container_name: uc_mailpit
    restart: always
    environment:
      MP_WEBROOT: /mailpit
    expose:
      - "8025"
    networks:
      - uc_network

  # Reverse-proxy HTTPS (Let's Encrypt automatique). Seul service exposé au public.
  caddy:
    image: caddy:2-alpine
    container_name: uc_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - nginx
      - api
      - mailpit
    networks:
      - uc_network

volumes:
  mysql_data:
  laravel_storage:
  laravel_logs:
  caddy_data:
  caddy_config:
  uploads_data:

networks:
  uc_network:
    driver: bridge
