version: '3.9'

services:

  db:
    image: mysql:8.0
    container_name: uc_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USERNAME}", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - uc_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: uc_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_ARBITRARY: 1
      #PMA_USER: ${DB_USERNAME}
      #PMA_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8081:80"
    depends_on:
      - db
    networks:
      - uc_network

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    container_name: uc_api_dev
    restart: unless-stopped
    volumes:
      - ./api:/app
      - ./web/public/uploads:/uploads
      - go_pkg_cache:/root/go/pkg/mod
      - go_build_cache:/root/.cache/go
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      API_PORT: "8888"
      UPLOAD_DIR: /uploads/photos
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_PUB_MENSUEL: ${STRIPE_PRICE_PUB_MENSUEL}
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_FROM: "noreply@upcycleconnect.fr"
    ports:
      - "8888:8888"
    depends_on:
      db:
        condition: service_started
    networks:
      - uc_network

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    container_name: uc_web_dev
    restart: unless-stopped
    volumes:
      - ./web:/var/www/html
      # Dossiers lourds en lecture/écriture déplacés sur le FS rapide du conteneur
      # (le bind-mount Windows ci-dessus est ~14x plus lent pour ces accès).
      - web_vendor:/var/www/html/vendor
      - web_storage_fw:/var/www/html/storage/framework
      - web_bootstrap_cache:/var/www/html/bootstrap/cache
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "http://localhost:8000"
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: file
      QUEUE_CONNECTION: database
      CACHE_STORE: file
      # Plusieurs workers pour le serveur de dev (sinon mono-thread)
      PHP_CLI_SERVER_WORKERS: "8"
      API_URL: "http://api:8888"
      API_PUBLIC_URL: "http://localhost:8888"
      JWT_SECRET: ${JWT_SECRET}
      RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY}
      VITE_DEV_SERVER_URL: "http://localhost:5173"
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      MAIL_ENCRYPTION: ""
      MAIL_FROM_ADDRESS: "noreply@upcycleconnect.fr"
      MAIL_FROM_NAME: "UpcycleConnect"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_started
      api:
        condition: service_started
      mailpit:
        condition: service_started
    networks:
      - uc_network
  
  mailpit:
    image: axllent/mailpit:latest
    container_name: uc_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"   # Web UI
      - "1025:1025"   # SMTP
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - uc_network

  vite:
    image: node:20-alpine
    container_name: uc_vite_dev
    working_dir: /app
    volumes:
      - ./web:/app
      - vite_node_modules:/app/node_modules
    command: >
      sh -c "npm install --frozen-lockfile && npm run dev -- --host"
    ports:
      - "5173:5173"
    networks:
      - uc_network

volumes:
  mysql_data:
  go_pkg_cache:
  go_build_cache:
  web_vendor:
  web_storage_fw:
  web_bootstrap_cache:
  vite_node_modules:

networks:
  uc_network:
    name: uc_network
    driver: bridge
