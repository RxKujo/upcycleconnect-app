version: '3.9'

services:

  db:
    image: mysql:8.0
    container_name: uc_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USERNAME}", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - uc_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: uc_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_ARBITRARY: 1
      #PMA_USER: ${DB_USERNAME}
      #PMA_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8081:80"
    depends_on:
      - db
    networks:
      - uc_network

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    container_name: uc_api_dev
    restart: unless-stopped
    volumes:
      - ./api:/app
      - ./web/public/uploads:/uploads
      - go_pkg_cache:/root/go/pkg/mod
      - go_build_cache:/root/.cache/go
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      API_PORT: "8888"
      UPLOAD_DIR: /uploads/photos
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_PUB_MENSUEL: ${STRIPE_PRICE_PUB_MENSUEL}
      # Mail : par défaut Mailpit (dev, sans auth/TLS). Pour envoyer de VRAIS
      # mails, pointer MAIL_HOST vers un serveur réel (serveur mail DMZ mission 2
      # ou relais) et renseigner MAIL_USERNAME/PASSWORD/ENCRYPTION.
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_FROM: ${MAIL_FROM:-noreply@upcycleconnect.fr}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-}
      # Stockage des photos : S3 (MinIO en dev). UPLOAD_DIR reste comme repli
      # local si STORAGE_DRIVER n'est pas "s3".
      STORAGE_DRIVER: s3
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: ${MINIO_BUCKET:-upcycleconnect}
      AWS_ENDPOINT: http://minio:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      # Push OneSignal (envoi). Laisser vide en dev = push ignoré (no-op).
      ONESIGNAL_APP_ID: ${ONESIGNAL_APP_ID:-}
      ONESIGNAL_API_KEY: ${ONESIGNAL_API_KEY:-}
      # GLPI (miroir des tickets d'incident). Vide = miroir désactivé (no-op).
      # Renseigner après avoir démarré le profil glpi et généré les tokens.
      GLPI_URL: ${GLPI_URL:-}
      GLPI_APP_TOKEN: ${GLPI_APP_TOKEN:-}
      GLPI_USER_TOKEN: ${GLPI_USER_TOKEN:-}
    ports:
      - "8888:8888"
    depends_on:
      db:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - uc_network

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    container_name: uc_web_dev
    restart: unless-stopped
    volumes:
      - ./web:/var/www/html
      # Dossiers lourds en lecture/écriture déplacés sur le FS rapide du conteneur
      # (le bind-mount Windows ci-dessus est ~14x plus lent pour ces accès).
      - web_vendor:/var/www/html/vendor
      - web_storage_fw:/var/www/html/storage/framework
      - web_bootstrap_cache:/var/www/html/bootstrap/cache
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "http://localhost:8000"
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: file
      QUEUE_CONNECTION: database
      CACHE_STORE: file
      # Plusieurs workers pour le serveur de dev (sinon mono-thread)
      PHP_CLI_SERVER_WORKERS: "8"
      API_URL: "http://api:8888"
      API_PUBLIC_URL: "http://localhost:8888"
      JWT_SECRET: ${JWT_SECRET}
      RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY}
      VITE_DEV_SERVER_URL: "http://localhost:5173"
      MAIL_MAILER: smtp
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM:-noreply@upcycleconnect.fr}
      MAIL_FROM_NAME: "UpcycleConnect"
      # Médias : écriture sur le bucket S3 (MinIO), lecture navigateur via
      # l'URL publique locale du bucket. AWS_ENDPOINT (minio:9000) sert à
      # l'écriture côté serveur ; MEDIA_URL (localhost:9000) sert au navigateur.
      MEDIA_DISK: s3
      MEDIA_URL: "http://localhost:9000/${MINIO_BUCKET:-upcycleconnect}"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: ${MINIO_BUCKET:-upcycleconnect}
      AWS_ENDPOINT: http://minio:9000
      AWS_URL: "http://localhost:9000/${MINIO_BUCKET:-upcycleconnect}"
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      # Push OneSignal (client web) : App ID exposé au navigateur. Vide = désactivé.
      ONESIGNAL_APP_ID: ${ONESIGNAL_APP_ID:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_started
      api:
        condition: service_started
      mailpit:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - uc_network
  
  mailpit:
    image: axllent/mailpit:latest
    container_name: uc_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"   # Web UI
      - "1025:1025"   # SMTP
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - uc_network

  # Stockage objet S3-compatible pour le dev (photos annonces/conteneurs/avatars).
  # Console web : http://localhost:9001 (minioadmin / minioadmin).
  minio:
    image: minio/minio:latest
    container_name: uc_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web
    volumes:
      - minio_data:/data
    networks:
      - uc_network

  # Crée le bucket et le rend lisible publiquement (photos "tout public"),
  # puis se termine. Attend que MinIO réponde avant d'agir.
  minio_init:
    image: minio/mc:latest
    container_name: uc_minio_init
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-upcycleconnect}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do echo 'attente MinIO...'; sleep 2; done;
      mc mb --ignore-existing local/$${MINIO_BUCKET};
      mc anonymous set download local/$${MINIO_BUCKET};
      echo 'bucket MinIO prêt';
      "
    networks:
      - uc_network

  # ─── GLPI (ticketing incidents) ────────────────────────────────────────────
  # Services optionnels (profil "glpi") : ne démarrent qu'avec
  #   docker compose -f docker-compose.dev.yml --profile glpi up -d
  # Installation GLPI au 1er lancement via http://localhost:8082 (assistant web),
  # puis activer l'API REST et générer App-Token + user_token (cf. docs/).
  glpi_db:
    image: mariadb:10.11
    container_name: uc_glpi_db
    profiles: ["glpi"]
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${GLPI_DB_ROOT_PASSWORD:-glpiroot}
      MARIADB_DATABASE: glpi
      MARIADB_USER: glpi
      MARIADB_PASSWORD: ${GLPI_DB_PASSWORD:-glpi}
    volumes:
      - glpi_db_data:/var/lib/mysql
    networks:
      - uc_network

  glpi:
    # GLPI 10.0.x : l'API REST legacy (apirest.php) attendue par le client Go
    # (api/pkg/glpi). L'image elestio télécharge la version fixée par VERSION_GLPI
    # (sans quoi = latest = GLPI 11, dont l'API REST legacy est cassée/dépréciée).
    image: elestio/glpi:10.0.15
    container_name: uc_glpi
    profiles: ["glpi"]
    restart: unless-stopped
    depends_on:
      - glpi_db
    environment:
      TIMEZONE: Europe/Paris
      VERSION_GLPI: "10.0.15"
    ports:
      - "8082:80"
    volumes:
      - glpi_data:/var/www/html/glpi
    networks:
      - uc_network

  vite:
    image: node:20-alpine
    container_name: uc_vite_dev
    working_dir: /app
    volumes:
      - ./web:/app
      - vite_node_modules:/app/node_modules
    command: >
      sh -c "npm install --frozen-lockfile && npm run dev -- --host"
    ports:
      - "5173:5173"
    networks:
      - uc_network

volumes:
  mysql_data:
  go_pkg_cache:
  go_build_cache:
  web_vendor:
  web_storage_fw:
  web_bootstrap_cache:
  vite_node_modules:
  minio_data:
  glpi_data:
  glpi_db_data:

networks:
  uc_network:
    name: uc_network
    driver: bridge
