; Configuration PHP pour le développement local (perf)

; --- OPcache : évite de recompiler tout le code PHP à chaque requête ---
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
; On revalide à chaque requête pour que les modifications de code soient prises
; en compte immédiatement (indispensable en dev), mais le code reste compilé en cache.
opcache.validate_timestamps=1
opcache.revalidate_freq=0
; JIT : accélère l'exécution (tracing)
opcache.jit=tracing
opcache.jit_buffer_size=128M

; --- realpath cache : réduit drastiquement les appels stat() coûteux
; sur le système de fichiers monté (bind mount Windows) ---
realpath_cache_size=4096K
realpath_cache_ttl=600

; Divers
memory_limit=512M
